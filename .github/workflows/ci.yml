name: CI/CD

# Run on every push to main + every PR targeting main. Pull-request runs catch
# regressions before code lands; push runs verify main itself stays green.
# Deploy jobs gate on push-to-main only (see their `if:` clause).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight run if a newer commit lands on the same branch — saves
# minutes when you push 3 fixes back-to-back.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Frontend: TypeScript typecheck + ESLint. Runs from `frontend/` directory.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (typecheck + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: ESLint
        run: npx eslint .

  # ---------------------------------------------------------------------------
  # Backend: Ruff lint (fast Python linter) + py_compile syntax check.
  # pytest is wired in but not run yet — add real tests under tests/ first.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (lint + syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Ruff lint
        # E,F = pyflakes + pycodestyle errors (catches unused imports, undefined
        # names, syntax errors). Start narrow, widen later. E501 (line length)
        # ignored — formatter's job, not lint's.
        run: ruff check --select=E,F --ignore=E501 .

      - name: Pytest (skipped if no tests directory exists)
        run: |
          if [ -d tests ] || compgen -G "tests_*" > /dev/null; then
            pytest -q
          else
            echo "No tests directory — skipping. Add tests/ to enable."
          fi

  # ---------------------------------------------------------------------------
  # CD: Deploy to Cloud Run after CI passes, only on push to main (not PRs).
  # Two parallel jobs — API service and Pipeline job — both use the Makefile
  # targets we already use locally, so deploy logic stays in one place.
  # ---------------------------------------------------------------------------
  deploy-api:
    name: Deploy API (Cloud Run Service)
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        # Lets the runner `docker push` to us-central1-docker.pkg.dev using
        # the gcloud-auth credentials from the previous step.
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build, push, and deploy API
        # Uses `make deploy-api` — same path you use locally, so any deploy
        # logic change lives in one file (Makefile), not duplicated in YAML.
        run: make deploy-api

  deploy-job:
    name: Deploy Pipeline (Cloud Run Job)
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build, push, and deploy Pipeline
        run: make deploy
